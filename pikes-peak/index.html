<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pikes Peak Marathon · Year over Year</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.js"></script>
<style>
  :root{
    --ink:#1b1b1a; --paper:#ffffff; --tint:#f6f6f3; --rule:#e6e6e2; --rule2:#d3d3cd;
    --muted:#74756f; --accent:#b45309;
    --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --serif:Georgia,"Iowan Old Style",Cambria,"Times New Roman",serif;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0; max-width:100%; overflow-x:clip}
  body{background:var(--paper); color:var(--ink); font-family:var(--sans); font-size:12.5px; line-height:1.4;
    -webkit-font-smoothing:antialiased; max-width:1320px; margin:0 auto}
  .wrap{padding:0 0 30px}
  b{font-weight:600}
  .num{font-family:var(--mono); font-variant-numeric:tabular-nums}
  /* masthead — editorial serif title, sans labels, mono figures */
  .mast{display:flex; flex-wrap:wrap; align-items:baseline; gap:3px 16px; border-bottom:1px solid var(--ink); padding:11px 13px 9px}
  .mast h1{font-family:var(--serif); font-weight:700; font-size:23px; letter-spacing:-.01em; margin:0 6px 0 0}
  .mast .kv{font-size:11.5px; color:var(--muted)}
  .mast .kv b{font-family:var(--mono); color:var(--ink); font-weight:500; font-variant-numeric:tabular-nums}
  .mast .spacer{margin-left:auto}
  /* module */
  .mod{border:1px solid var(--rule); margin:9px 13px 0; background:var(--paper)}
  .modhd{display:flex; flex-wrap:wrap; justify-content:space-between; gap:2px 10px; align-items:baseline; padding:6px 10px;
    border-bottom:1px solid var(--rule); background:var(--tint);
    font-size:11px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; color:var(--ink)}
  .modhd>span:first-child{white-space:nowrap}
  .modhd .r{font-family:var(--mono); font-size:10.5px; font-weight:400; letter-spacing:0; text-transform:none; color:var(--muted)}
  /* layout */
  .rail{display:grid; grid-template-columns:1fr; gap:0}
  @media (min-width:920px){ .rail{grid-template-columns:minmax(360px,1fr) minmax(0,1.3fr); align-items:start} }
  /* scrubber */
  .scrub{border:1px solid var(--rule); margin:9px 13px 0; padding:7px 10px}
  .scrubhead{display:flex; justify-content:space-between; align-items:baseline; font-size:11px; color:var(--muted)}
  .scrubhead b{font-family:var(--mono); color:var(--ink); font-size:14px; font-weight:600; font-variant-numeric:tabular-nums}
  .scrub input[type=range]{width:100%; accent-color:var(--ink); height:18px; margin:4px 0 0}
  /* live telemetry table — sans labels, mono figures */
  #tel{overflow-x:auto}
  table.tel{width:100%; table-layout:fixed; border-collapse:collapse; font-size:10px}
  table.tel th{color:var(--muted); text-align:right; padding:4px 3px; border-bottom:1px solid var(--rule2); font-weight:600; letter-spacing:.02em; overflow:hidden; white-space:nowrap}
  table.tel th:first-child,table.tel td:first-child{text-align:left}
  table.tel td{font-family:var(--mono); font-variant-numeric:tabular-nums; text-align:right; padding:3px 3px; border-bottom:1px solid var(--rule); white-space:nowrap; overflow:hidden}
  table.tel td.yr{font-family:var(--sans)}
  table.tel tr:last-child td{border-bottom:none}
  table.tel tr.lead td{background:#f7f7f3}
  table.tel .run{color:#15803d} table.tel .walk{color:var(--accent); font-weight:600}
  .state{display:grid; grid-template-columns:auto auto auto; justify-content:space-between; gap:1px 14px; font-size:11px; color:var(--muted); padding:6px 10px; border-top:1px solid var(--rule)}
  .state span{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .state b{font-family:var(--mono); color:var(--ink); font-weight:500}
  /* map */
  #map{height:clamp(260px,40vh,420px); overflow:hidden}
  #trailtoggle{cursor:pointer; border-bottom:1px solid var(--rule2)}
  #trailtoggle:hover{color:var(--ink)}
  /* chart panels — sans for labels, mono only for numeric axis ticks (text.num) */
  #charts svg{font-family:var(--sans)}
  #charts svg text.num{font-family:var(--mono)}
  .panel{border-top:1px solid var(--rule)}
  .panel:first-child{border-top:none}
  .pchart{position:relative; touch-action:pan-y; user-select:none; -webkit-user-select:none}
  .pcap{font-size:10px; color:#8a9099; text-align:right; padding:0 10px 5px}
  .pchart svg{display:block; width:100%}
  #refsel{font:600 11.5px var(--mono); color:var(--ink); background:transparent; border:0; border-bottom:1px solid var(--rule2); padding:0 2px 1px; cursor:pointer; -webkit-appearance:none; appearance:none}
  #refsel:hover{border-color:var(--ink)}
  .yearchips b{cursor:pointer; padding:0 3px; opacity:.28; font-weight:600; font-family:var(--mono); text-decoration:line-through; user-select:none}
  .yearchips b.on{opacity:1; text-decoration:none}
  /* phones: sticky scrub bar, bigger tap targets, sticky first column on the split table */
  @media (max-width:919px){
    .mast{padding:10px 13px 8px; gap:4px 12px}
    .mast h1{flex-basis:100%; margin:0}
    .mast .spacer{margin-left:0}
    .yearchips b{padding:4px 5px; font-size:13px}
    #refsel{font-size:13px}
    .scrub{position:fixed; left:0; right:0; bottom:0; z-index:5; margin:0; background:var(--paper); border:0; border-top:1px solid var(--rule2);
      padding:7px 13px calc(7px + env(safe-area-inset-bottom,0px)); box-shadow:0 -6px 12px rgba(0,0,0,.05)}
    body{padding-bottom:72px}
    table.tel{font-size:11px}
    #map{height:clamp(240px,40vh,360px)}
    table.sect{font-size:11px}
    table.sect th,table.sect td{padding:5px 7px}
    table.sect th:first-child,table.sect td:first-child{position:sticky; left:0; z-index:1; background:var(--paper); box-shadow:1px 0 0 var(--rule)}
    table.sect tr.tot td:first-child{background:var(--paper)}
    table.sect .aux{display:none}   /* mile range + elevation change: secondary, make room for the years */
  }
  .seg b{cursor:pointer; opacity:.45; font-weight:600; color:var(--ink)}
  .seg b.on{opacity:1; text-decoration:underline}
  .seg b+b{margin-left:7px}
  table.sect td.ahead{color:#15803d}
  table.sect th[data-y],table.sect td[data-y]{cursor:pointer}
  table.tel tr[data-y]{cursor:pointer}
  /* sector matrix */
  #sectors{overflow-x:auto}
  table.sect{width:100%; border-collapse:collapse; font-size:11.5px}
  table.sect th{color:var(--muted); text-align:right; padding:5px 9px; border-bottom:1px solid var(--rule2); font-weight:600; letter-spacing:.02em}
  table.sect th:first-child,table.sect td:first-child,table.sect td.sn{text-align:left}
  table.sect td{font-family:var(--mono); font-variant-numeric:tabular-nums; text-align:right; padding:4px 9px; border-bottom:1px solid var(--rule); white-space:nowrap}
  table.sect td.sn{font-family:var(--sans)}
  table.sect td.mu{color:var(--muted)}
  table.sect td.win{font-weight:700}
  table.sect tr.tot td{border-top:1px solid var(--rule2); font-weight:600}
  table.sect tr.tot td:first-child{font-family:var(--sans)}
</style>
</head>
<body>
<div class="wrap">
  <header class="mast">
    <h1>Pikes Peak Marathon</h1>
    <span class="kv">distance <b>26.2&nbsp;mi</b></span>
    <span class="kv">climb <b id="gain"></b></span>
    <span class="kv">runs <b>2017–2026</b></span>
    <span class="kv spacer">years <span class="yearchips" id="yearpick" title="click to toggle a year on/off"></span></span>
    <span class="kv">reference <select id="refsel" title="year the gaps are measured against"></select></span>
  </header>

  <div class="mod">
    <div class="modhd"><span>Sector splits</span><span class="r"><span class="seg" id="sectmode"><b data-m="abs">times</b><b data-m="diff">vs ref</b></span> · <span id="sectsum"></span></span></div>
    <div id="sectors"></div>
  </div>
  <div class="mod" id="chartsmod">
    <div class="modhd"><span>All channels vs distance</span></div>
    <div id="charts"></div>
  </div>
  <div class="rail">
    <div>
      <div class="scrub">
        <div class="scrubhead"><span>T+<b id="curd">0:00</b> / <span id="curtot"></span></span><span id="curele"></span></div>
        <input type="range" id="scrub" min="0" value="0" step="1">
      </div>
      <div class="mod">
        <div class="modhd"><span>At this moment</span></div>
        <div id="tel"></div>
        <div class="state" id="staterow"></div>
      </div>
    </div>
    <div class="mod">
      <div class="modhd"><span>Course · position replay</span><span class="r">Manitou → summit → Manitou · <span id="trailtoggle"></span></span></div>
      <div id="map"></div>
    </div>
  </div>
</div>

  // axis fits every active year except the single worst one (with 3+ years), so one blow-up year
  // pins to the panel edge instead of flattening the rest
  const mx=YEARS.filter(y=>y!==REF).map(y=>Math.max(...GAP[y].map(Math.abs))).sort((a,b)=>b-a);
  gMax=mx.length>=3?mx[1]:(mx[0]||60); gMax=Math.max(60, Math.ceil(gMax/60)*60); }
rebuildGap();
function tAtDist(y,d){ return interpArr(T[y], Math.max(0,Math.min(N-1,d/STEP))); }
// ---- time-replay helpers: where was each year at elapsed time t? ----
let MAXFIN = Math.max(...YEARS.map(y=>DATA.finish[y]));
const lerp=(a,b,f)=>a+(b-a)*f;
function interpArr(arr,di){ const i=Math.floor(di);
  if(i>=N-1) return arr[N-1]; if(i<=0) return arr[0]; return lerp(arr[i],arr[i+1],di-i); }
function mk(y,di,done){ const i=Math.max(0,Math.min(N-1,Math.round(di)));
  return {di, idx:i, dist:interpArr(D,di), lat:interpArr(LAT,di), lon:interpArr(LON,di),
    pace:PACE[y][i], gap:interpArr(GAP[y],di), hr:HR[y]?interpArr(HR[y],di):null, cad:SPM[y]?interpArr(SPM[y],di):null, done:!!done}; }
function posAt(y,t){ const TT=T[y], fin=DATA.finish[y];
  if(t<=0) return mk(y,0,false);
  if(t>=fin) return mk(y,N-1,true);
  let lo=0,hi=N-1; while(lo<hi){const m=(lo+hi)>>1; if(TT[m]<=t)lo=m+1; else hi=m;}
  const i=Math.max(0,lo-1), seg=TT[i+1]-TT[i], f=seg>0?(t-TT[i])/seg:0;
  return mk(y,i+f,false); }
// map position of each year at elapsed time t, on the shared track
function runnersFC(t){ return {type:"FeatureCollection",features:YEARS.map(y=>{const p=posAt(y,t);
  return {type:"Feature",properties:{y},geometry:{type:"Point",coordinates:[p.lon,p.lat]}};})}; }
// total climb
let gain=0; for(let i=1;i<N;i++){const d=ELE[i]-ELE[i-1]; if(d>0)gain+=d;}
$("#gain").textContent = (Math.round(gain/10)*10).toLocaleString()+" ft";

// scale spans this course's 8–28 min/mi rather than a flat race's
const pq=q=>allp[Math.floor((allp.length-1)*q)];
const SPDEXPR=["interpolate",["linear"],["get","spd"],pq(.1),"#1a9850",pq(.4),"#f6d743",pq(.7),"#ef6f4c",pq(.95),"#b2182b"];
function renderTrailToggle(){ const t=$("#trailtoggle"); if(t)t.textContent=trailMode==="pace"?`color: ${REF} pace`:"color: fastest year"; }
function toggleTrail(){ trailMode=trailMode==="year"?"pace":"year";
  if(mapReady&&map) map.setPaintProperty("course","line-color", trailMode==="pace"?SPDEXPR:DOMEXPR);
  renderTrailToggle(); }
// course segments, each tagged with the fastest active year there and the reference year's pace
function courseFC(){ const feats=[];
  for(let i=0;i<N-1;i++) feats.push({type:"Feature",properties:{y:WIN[i], spd:PACE[REF][i]||12},
    geometry:{type:"LineString",coordinates:[[LON[i],LAT[i]],[LON[i+1],LAT[i+1]]]}});
  return {type:"FeatureCollection",features:feats}; }
function refreshMapData(){ if(!mapReady||!map) return; const c=map.getSource("course"); if(c)c.setData(courseFC()); }
function initMap(){
  if(typeof mapboxgl==="undefined"||!MAPBOX_TOKEN) return;
  let lo=[180,90],hi=[-180,-90];
  for(let i=0;i<N;i++){lo[0]=Math.min(lo[0],LON[i]);lo[1]=Math.min(lo[1],LAT[i]);hi[0]=Math.max(hi[0],LON[i]);hi[1]=Math.max(hi[1],LAT[i]);}

/* ================= dense multi-panel charts · every channel at once ================= */
let PGW=760, PGL=54, FS=1; const PGR=14;   // shared plot geometry (px) across all panels; FS scales chart type on phones
const fs=v=>(v*FS).toFixed(1);
let PHT=124; const PTT=16;                   // panel svg height / plot top (height set per width in renderCharts)
const panelH=p=>p.k==="delta"?Math.round(PHT*1.4):PHT;   // the gap panel gets extra room for its grid
function xOf(d){ return PGL + (d/TOTAL)*(PGW-PGL-PGR); }
function xToDist(px){ return Math.max(0,Math.min(TOTAL,(px-PGL)/(PGW-PGL-PGR)*TOTAL)); }
// walk/run classification — cadence is bimodal; RUN if pace<11:00/mi OR smoothed cadence>=150
const RUNTHRESH=150, WALKPACE=11;
function spmSmooth(y,i){ if(!SPM[y])return 0; let s=0,n=0; for(let j=Math.max(0,i-3);j<=Math.min(N-1,i+3);j++){const v=SPM[y][j]; if(v){s+=v;n++;}} return n?s/n:0; }
function isRun(y,i){ const p=PACE[y][i]; if(p!=null && p<WALKPACE) return true; return spmSmooth(y,i)>=RUNTHRESH; }
function laneCenter(k){ const h=(PHT-6-PTT)/YEARS.length; return (PTT+k*h+h/2).toFixed(1); }
function sectorAt(d){ for(const S of SECTORS) if(d>=S.a && d<S.b) return S; return SECTORS[SECTORS.length-1]; }
const PANELS=[
 {k:"delta",ttl:()=>"BEHIND / AHEAD OF "+REF, unit:"minutes · + behind · − ahead", dir:"zero"},
 {k:"pace", ttl:"PACE",             unit:"min/mi",     arr:()=>PACE,   lo:()=>pMin, hi:()=>pMax, dir:"lowTop",  step:4,  tick:v=>v},
 {k:"gap",  ttl:"GRADE-ADJ PACE",   unit:"min/mi",     arr:()=>GAPACE, lo:()=>pMin, hi:()=>pMax, dir:"lowTop",  step:4,  tick:v=>v},
 {k:"hr",   ttl:"HEART RATE",       unit:"bpm",        arr:()=>HR,     lo:()=>hrMin,hi:()=>hrMax,dir:"highTop", step:20, tick:v=>v},
 {k:"cad",  ttl:"WALKING vs RUNNING", unit:"run = pace under 11:00/mi or cadence ≥ 150 spm · hatched years have no cadence data", dir:"cad"},
];
function valueY(p,v,T,B){
  if(p.dir==="zero"){ const C=(T+B)/2; return C+(Math.max(-gMax,Math.min(gMax,v))/gMax)*((B-T)/2); }
  const lo=p.lo(),hi=p.hi(),vv=Math.max(lo,Math.min(hi,v)),f=(vv-lo)/((hi-lo)||1);
  return p.dir==="lowTop" ? T+f*(B-T) : B-f*(B-T);
}
function backdrop(T,B){ let s="M"+xOf(0).toFixed(1)+" "+B;
  for(let i=0;i<N;i++) s+="L"+xOf(D[i]).toFixed(1)+" "+(B-(ELE[i]-eMin)/((eMax-eMin)||1)*(B-T)*0.82).toFixed(1);
  return s+"L"+xOf(TOTAL).toFixed(1)+" "+B+"Z"; }
function sectorShade(T,B){ let s=""; SECTORS.forEach((S,i)=>{ if(i>0){ const x=xOf(S.a).toFixed(1);
  s+=`<line x1="${x}" y1="${T}" x2="${x}" y2="${B}" stroke="#d3d5d9" stroke-dasharray="2 3"/>`; } }); return s; }
function lineBody(p,T,B){
  let grid=""; for(let v=Math.ceil(p.lo()/p.step)*p.step; v<=p.hi(); v+=p.step){ const y=valueY(p,v,T,B).toFixed(1);
    grid+=`<line x1="${PGL}" y1="${y}" x2="${PGW-PGR}" y2="${y}" stroke="#edeff1"/>`
      +`<text class="num" x="${PGL-3}" y="${(+y+3).toFixed(1)}" text-anchor="end" font-size="${fs(8)}" fill="#9aa0a6">${p.tick(v)}</text>`; }
  const data=p.arr();
  const path=a=>{let s="";for(let i=0;i<N;i++){const v=a[i]; if(v==null)continue; s+=(s?"L":"M")+xOf(D[i]).toFixed(1)+" "+valueY(p,v,T,B).toFixed(1)+" ";}return s;};
  let ln=""; YEARS.forEach(y=>{ if(!data[y])return; ln+=`<path data-y="${y}" d="${path(data[y])}" fill="none" stroke="${COL[y]}" stroke-width="1.4" stroke-linejoin="round" opacity=".95"/>`;});
  let dt="",gl=""; YEARS.forEach(y=>{ if(!data[y])return; const v0=data[y][0]??p.lo();
    gl+=`<line id="pg_${p.k}_${y}" data-y="${y}" x1="${xOf(0)}" y1="${T}" x2="${xOf(0)}" y2="${B}" stroke="${COL[y]}" stroke-width="1" opacity=".26" stroke-dasharray="3 2"/>`;
    dt+=`<circle id="pd_${p.k}_${y}" data-y="${y}" r="3.1" fill="${COL[y]}" stroke="#fff" stroke-width="1.1" cx="${xOf(0)}" cy="${valueY(p,v0,T,B)}"/>`;});
  return grid+ln+gl+dt;
}
// grid step for the gap axis: the smallest tidy interval giving at most ~5 lines each side of zero
function gapStep(){ for(const st of [15,30,60,120,300,600,900,1200,1800,3600]) if(gMax/st<=5) return st; return 3600; }
function deltaBody(p,T,B){
  let grid=""; const st=gapStep();
  for(let g=-Math.floor(gMax/st)*st; g<=gMax; g+=st){ const y=valueY(p,g,T,B).toFixed(1), z=g===0;
    grid+=`<line x1="${PGL}" y1="${y}" x2="${PGW-PGR}" y2="${y}" stroke="${z?'#b7bcc3':'#e4e7ea'}"${z?' stroke-width="1.2"':''}/>`
      +`<text class="num" x="${PGL-3}" y="${(+y+3).toFixed(1)}" text-anchor="end" font-size="${fs(8)}" fill="#9aa0a6">${z?'0':(g<0?'−':'+')+(st>=60?Math.abs(g)/60:'0:'+String(Math.abs(g)).padStart(2,'0'))}</text>`; }
  const path=a=>{let s="";for(let i=0;i<N;i++) s+=(i?"L":"M")+xOf(D[i]).toFixed(1)+" "+valueY(p,a[i],T,B).toFixed(1)+" ";return s;};
  let ln=""; YEARS.forEach(y=> ln+=`<path data-y="${y}" d="${path(GAP[y])}" fill="none" stroke="${COL[y]}" stroke-width="${y===REF?2:1.4}" stroke-linejoin="round" opacity=".95"/>`);
  let dt="",gl=""; YEARS.forEach(y=>{
    gl+=`<line id="pg_${p.k}_${y}" data-y="${y}" x1="${xOf(0)}" y1="${T}" x2="${xOf(0)}" y2="${B}" stroke="${COL[y]}" stroke-width="1" opacity=".26" stroke-dasharray="3 2"/>`;
    dt+=`<circle id="pd_${p.k}_${y}" data-y="${y}" r="3.1" fill="${COL[y]}" stroke="#fff" stroke-width="1.1" cx="${xOf(0)}" cy="${valueY(p,GAP[y][0],T,B)}"/>`;});
  return grid+ln+gl+dt;
}
function cadBody(p,T,B){
  const h=(B-T)/YEARS.length; let lanes="";
  let defs="<defs>"; YEARS.forEach(y=>{ if(SPM[y]) return;
    defs+=`<pattern id="hatch_${y}" patternUnits="userSpaceOnUse" width="4" height="4" patternTransform="rotate(45)"><rect width="4" height="4" fill="#f4f5f7"/><rect width="1.6" height="4" fill="${COL[y]}"/></pattern>`; });
  defs+="</defs>";
  YEARS.forEach((y,k)=>{ const y0=T+k*h+2, y1=T+(k+1)*h-2, runFill=SPM[y]?COL[y]:`url(#hatch_${y})`; let i=0;
    while(i<N){ const run=isRun(y,i); let j=i+1; while(j<N&&isRun(y,j)===run)j++;
      const x0=xOf(D[i]),x1=xOf(D[Math.min(j,N-1)]);
      lanes+=`<rect data-y="${y}" x="${x0.toFixed(1)}" y="${y0.toFixed(1)}" width="${Math.max(0.5,x1-x0).toFixed(1)}" height="${(y1-y0).toFixed(1)}" fill="${run?runFill:'#dfe3e8'}" opacity="${run?0.9:1}"/>`;
      i=j; }
    lanes+=`<text data-y="${y}" class="num" x="${PGL-3}" y="${((y0+y1)/2+3).toFixed(1)}" text-anchor="end" font-size="${fs(8)}" fill="${COL[y]}">${y}</text>`; });
  let dt="",gl=""; YEARS.forEach((y,k)=>{
    gl+=`<line id="pg_cad_${y}" data-y="${y}" x1="${xOf(0)}" y1="${T}" x2="${xOf(0)}" y2="${B}" stroke="${COL[y]}" stroke-width="1" opacity=".26" stroke-dasharray="3 2"/>`;
    dt+=`<circle id="pd_cad_${y}" data-y="${y}" r="3.1" fill="#fff" stroke="${COL[y]}" stroke-width="1.5" cx="${xOf(0)}" cy="${laneCenter(k)}"/>`;});
  return defs+lanes+gl+dt;
}
function panelSVG(p){ const W=PGW,H=panelH(p),T=PTT,B=H-6;
  const body = p.k==="cad"?cadBody(p,T,B) : p.dir==="zero"?deltaBody(p,T,B) : lineBody(p,T,B);
  const title=typeof p.ttl==="function"?p.ttl():p.ttl;
  const fits=(title.length*6.2+p.unit.length*5+30)*FS < W-PGL-PGR;   // rough text-width estimate
  const ttl=`<text x="${PGL+1}" y="${T-5}" font-size="${fs(9)}" font-weight="700" fill="#14171a">${title}</text>`
    +(fits?`<text x="${W-PGR}" y="${T-5}" text-anchor="end" font-size="${fs(8.5)}" fill="#8a9099">${p.unit}</text>`:"");
  return `<div class="pchart" data-k="${p.k}"><svg viewBox="0 0 ${W} ${H}" height="${H}" preserveAspectRatio="xMidYMid meet">`
    +sectorShade(T,B)+(p.k==="cad"?"":`<path d="${backdrop(T,B)}" fill="#eaedf0"/>`)+ttl+body+`</svg>`
    +(fits?"":`<div class="pcap">${p.unit}</div>`)+`</div>`;
}
function sectorRulerSVG(){ const W=PGW,H=20; let s=`<svg viewBox="0 0 ${W} ${H}" height="${H}" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%">`;
  SECTORS.forEach((S,i)=>{ const x0=xOf(S.a),x1=xOf(S.b),cx=((x0+x1)/2).toFixed(1);
    const lab = (x1-x0) > (S.s.length*5.4+8)*FS ? S.s : S.s.slice(0,1);   // arrow only when the name won't fit
    if(i>0) s+=`<line x1="${x0.toFixed(1)}" y1="0" x2="${x0.toFixed(1)}" y2="${H}" stroke="#e0e2df"/>`;
    s+=`<text x="${cx}" y="13" text-anchor="middle" font-size="${fs(8.5)}" fill="#596069">${lab}</text>`; });
  return `<div style="border-bottom:1px solid #d9dce0">`+s+`</svg></div>`; }
function mileRulerSVG(){ const W=PGW,H=15, lab=TOTAL>15?2:1, minr=TOTAL>15?1:0.5; let s=`<svg viewBox="0 0 ${W} ${H}" height="${H}" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%">`;
  for(let d=0;d<=TOTAL+1e-6;d+=minr){ const x=xOf(Math.min(d,TOTAL)).toFixed(1), maj=Math.abs(d/lab-Math.round(d/lab))<1e-6;
    s+=`<line x1="${x}" y1="0" x2="${x}" y2="${maj?5:3}" stroke="#a8aeb5"/>`;
    if(maj) s+=`<text class="num" x="${x}" y="13" text-anchor="middle" font-size="${fs(8.5)}" fill="#596069">${Math.round(d)}</text>`; }
  return `<div style="border-top:1px solid #d9dce0">`+s+`</svg></div>`; }
function renderCharts(){ const wrap=$("#charts"); if(!wrap) return; PGW=wrap.clientWidth||760;
  const narrow=PGW<560; FS=narrow?1.2:1; PGL=narrow?40:54; PHT=PGW>900?150:124;
  wrap.innerHTML = sectorRulerSVG() + PANELS.map(p=>`<div class="panel">${panelSVG(p)}</div>`).join("") + mileRulerSVG(); }
function renderYearPick(){ const h=$("#yearpick"); if(h) h.innerHTML=ALL_YEARS.map(y=>`<b data-y="${y}" class="${YEARS.includes(y)?'on':''}" style="color:${COL[y]}">${(""+y).slice(2)}</b>`).join(""); }
function toggleYear(y){
  if(YEARS.includes(y)){ if(YEARS.length<=1) return; YEARS=YEARS.filter(v=>v!==y); }   // keep at least one year
  else YEARS=ALL_YEARS.filter(v=>v===y||YEARS.includes(v));
  if(!YEARS.includes(REF)) REF=YEARS.reduce((b,v)=>DATA.finish[v]<DATA.finish[b]?v:b, YEARS[0]);

}

/* sector matrix · per-year splits, dominance, elevation Δ, spread, theoretical best */
function renderSectors(){
  const host=$("#sectors"); if(!host) return;
  const rows=SECTORS.map(S=>{ const times=YEARS.map(y=>tAtDist(y,S.b)-tAtDist(y,S.a)); const best=Math.min(...times);
    return {S,times,best,by:YEARS[times.indexOf(best)]}; });
  const totals=YEARS.map(y=>DATA.finish[y]); const ideal=rows.reduce((s,r)=>s+r.best,0); const fastest=Math.min(...totals);
  const diff=SECTMODE==="diff", cell=(t,tref,y)=> (diff&&y!==REF)?fmtGap(t-tref):fmtClock(t);
  const head=`<tr><th>sector</th><th class="aux">mi</th><th class="aux">Δft</th>`+YEARS.map(y=>`<th data-y="${y}" style="color:${COL[y]}">${y}</th>`).join("")+`<th>best</th><th>spread</th></tr>`;
  const body=rows.map(r=>{ const i0=Math.round(r.S.a/STEP), i1=Math.min(N-1,Math.round(r.S.b/STEP)), dft=Math.round(ELE[i1]-ELE[i0]);
    const spread=Math.round(Math.max(...r.times)-Math.min(...r.times));
    return `<tr><td class="sn">${r.S.n}</td><td class="mu aux">${r.S.a.toFixed(2)}–${r.S.b.toFixed(2)}</td><td class="mu aux">${dft>0?'+':''}${dft}</td>`
      +r.times.map((t,k)=>{ const y=YEARS[k], win=y===r.by, tref=r.times[YEARS.indexOf(REF)], ahead=diff&&y!==REF&&t<tref;
        return `<td data-y="${y}" class="${win?'win':''}${ahead?' ahead':''}" style="${win?'color:'+COL[y]:''}">${cell(t,tref,y)}</td>`; }).join("")
      +`<td class="mu">${fmtClock(r.best)}</td><td class="mu">${spread<60?spread+"s":fmtClock(spread)}</td></tr>`; }).join("");
  const foot=`<tr class="tot"><td>FINISH</td><td class="mu aux">0.00–${TOTAL.toFixed(2)}</td><td class="mu aux">+${Math.round(gain)}</td>`
    +YEARS.map((y,k)=>{ const win=totals[k]===fastest, tref=DATA.finish[REF], ahead=diff&&y!==REF&&totals[k]<tref;
      return `<td data-y="${y}" class="${win?'win':''}${ahead?' ahead':''}" style="${win?'color:'+COL[y]:''}">${cell(totals[k],tref,y)}</td>`; }).join("")
    +`<td class="mu">${fmtClock(ideal)}</td><td></td></tr>`;
  host.innerHTML=`<table class="sect"><thead>${head}</thead><tbody>${body}${foot}</tbody></table>`;
  const sx=$("#sectsum"); if(sx) sx.textContent=`best sectors combined ${fmtClock(ideal)}, ${fmtGap(ideal-fastest)} vs fastest finish`;
  $("#sectmode").querySelectorAll("b").forEach(b=>{ b.classList.toggle("on",b.dataset.m===SECTMODE); if(b.dataset.m==="diff") b.textContent="vs "+REF; });
}

/* ---------- live telemetry + scrub (by elapsed time) ---------- */
let tNow=0;
function renderTel(pos){
  const dists=pos.map(p=>p.dist), leadDist=Math.max(...dists);
  const info=YEARS.map((y,k)=>({y,p:pos[k]})).sort((a,b)=>(b.p.dist-a.p.dist)||(DATA.finish[a.y]-DATA.finish[b.y]));
  const leadY=info[0].y;
  let rows="";
  info.forEach((o,rank)=>{ const {y,p}=o; const lead=rank===0&&leadDist>0, run=isRun(y,p.idx);
    const intv=p.done?"finished":leadDist<=0?"—":lead?"leader":fmtGap(tNow-tAtDist(leadY,p.dist));
    rows+=`<tr data-y="${y}" class="${lead?'lead':''}"><td class="yr"><b style="color:${COL[y]}">${y}</b></td>`
      +`<td>${p.dist.toFixed(2)}</td><td>${p.done?'—':fmtPace(p.pace)}</td>`
      +`<td class="${run?'run':'walk'}">${run?'RUN':'WALK'}</td><td>${fmtGap(p.gap)}</td><td>${intv}</td></tr>`; });
  $("#tel").innerHTML=`<table class="tel"><colgroup><col style="width:14%"><col style="width:14%"><col style="width:14%"><col style="width:14%"><col style="width:22%"><col style="width:22%"></colgroup><thead><tr><th>year</th><th>mi</th><th>pace</th><th>state</th><th>vs ${REF}</th><th>to leader</th></tr></thead><tbody>${rows}</tbody></table>`;
  return {leadY,leadDist};
}
function scrub(t){
  tNow=Math.max(0,Math.min(MAXFIN,t));
  const sl=$("#scrub"); if(sl) sl.value=tNow;
  $("#curd").textContent=fmtClock(tNow); $("#curtot").textContent=fmtClock(MAXFIN);
  const pos=YEARS.map(y=>posAt(y,tNow));
  const {leadY,leadDist}=renderTel(pos);
  const ld=pos[YEARS.indexOf(leadY)], lmi=ld?ld.dist:0;
  const gpct=Math.round(GRADE[Math.max(0,Math.min(N-1,Math.round(lmi/STEP)))]*100);
  $("#staterow").innerHTML=`<span>grade <b>${gpct>0?'+':''}${gpct}%</b></span><span>leader <b style="color:${COL[leadY]}">${leadY}</b> @${lmi.toFixed(2)}mi</span><span>sector <b>${sectorAt(lmi).s}</b></span>`;
  const ce=$("#curele"); if(tNow>=MAXFIN){ ce.textContent="finished"; ce.style.color=""; }
  else if(leadDist>0){ ce.textContent=leadY; ce.style.color=COL[leadY]; } else { ce.textContent="start"; ce.style.color=""; }
  YEARS.forEach((y,k)=>{ const p=pos[k]; const cx=xOf(p.dist).toFixed(1);
    PANELS.forEach(P=>{ const dot=$("#pd_"+P.k+"_"+y), g=$("#pg_"+P.k+"_"+y); if(!dot)return;
      if(P.k==="cad"){ dot.setAttribute("cx",cx); dot.setAttribute("cy",laneCenter(k)); if(g){g.setAttribute("x1",cx);g.setAttribute("x2",cx);} return; }
      const arr = P.dir==="zero" ? null : P.arr()[y];
      if(P.dir!=="zero" && !arr) return;   // this year has no data for this channel
      dot.setAttribute("cx",cx); if(g){g.setAttribute("x1",cx);g.setAttribute("x2",cx);}
      let v = P.dir==="zero" ? p.gap : arr[p.idx]; if(v==null) v=P.dir==="zero"?0:P.lo();
      dot.setAttribute("cy",valueY(P,v,PTT,panelH(P)-6));
    }); });
  if(mapReady){ const src=map.getSource("runners"); if(src)src.setData(runnersFC(tNow)); }
  writeState();
}
// dragging any panel sets the time the reference year reached that distance
function xToTime(clientX, host){ const r=host.getBoundingClientRect();
  const px=(clientX-r.left)/(r.width||1)*PGW; const d=xToDist(px);
  return interpArr(T[REF], Math.max(0,Math.min(N-1,d/STEP))); }

/* ---------- highlight one year everywhere: hover = transient, click a table year = pinned ---------- */
let HLpin=null;
document.head.insertAdjacentHTML("beforeend","<style>"+ALL_YEARS.map(y=>
  `body[data-hl="${y}"] #charts [data-y]:not([data-y="${y}"]){opacity:.1}
   body[data-hl="${y}"] #charts path[data-y="${y}"]{stroke-width:2.6}
   body[data-hl="${y}"] table [data-y]:not([data-y="${y}"]){opacity:.3}`).join("\n")+"</style>");
function setHL(y){ if(y) document.body.dataset.hl=y; else delete document.body.dataset.hl;
  if(mapReady&&map) map.setPaintProperty("runners","circle-opacity", y?["case",["==",["get","y"],y],1,0.2]:1); }
(function(){ const hot=e=>{ const el=e.target.closest&&e.target.closest("[data-y]"); return el&&el.closest("#yearpick,#sectors,#tel,#charts")?+el.dataset.y:null; };
  document.addEventListener("pointerover",e=>{ if(e.pointerType!=="mouse")return; const y=hot(e); if(y!=null) setHL(y); });
  document.addEventListener("pointerout",e=>{ if(e.pointerType!=="mouse")return; if(hot(e)!=null) setHL(HLpin); });
  document.addEventListener("click",e=>{ const el=e.target.closest&&e.target.closest("#sectors [data-y], #tel tr[data-y]"); if(!el)return;
    const y=+el.dataset.y; HLpin=HLpin===y?null:y; setHL(HLpin); });
})();

/* ---------- wiring ---------- */
renderYearPick(); renderRef(); renderTrailToggle();
$("#trailtoggle") && $("#trailtoggle").addEventListener("click",toggleTrail);
$("#sectmode") && $("#sectmode").addEventListener("click",e=>{ const b=e.target.closest("b[data-m]"); if(!b)return; SECTMODE=b.dataset.m; renderSectors(); writeState(); });
$("#yearpick") && $("#yearpick").addEventListener("click",e=>{ const b=e.target.closest("b[data-y]"); if(!b)return; toggleYear(+b.dataset.y); });
$("#refsel") && $("#refsel").addEventListener("change",e=>{
  REF=+e.target.value; rebuildGap(); renderRef(); renderTrailToggle(); renderCharts(); renderSectors(); refreshMapData(); scrub(tNow); writeState(); });
const sc=$("#scrub"); sc.max=MAXFIN; sc.addEventListener("input", e=>scrub(+e.target.value));
// mouse: press-and-drag scrubs at once. touch: a vertical swipe scrolls the page (touch-action: pan-y),
// a horizontal drag scrubs, and a tap jumps to that distance.
(function(){ const wrap=$("#charts"); if(!wrap) return; let down=false, armed=false, sx=0, sy=0, pid=null;
  const go=e=>{ const pc=(e.target.closest&&e.target.closest(".pchart"))||wrap.querySelector(".pchart"); if(!pc)return;
    scrub(xToTime(e.clientX, pc)); };
  const arm=()=>{ armed=true; try{wrap.setPointerCapture(pid);}catch(_){ } };
  wrap.addEventListener("pointerdown",e=>{ if(!e.target.closest(".pchart"))return;
    down=true; armed=false; sx=e.clientX; sy=e.clientY; pid=e.pointerId;
    if(e.pointerType==="mouse"){ arm(); go(e); } });
  wrap.addEventListener("pointermove",e=>{ if(!down)return;
    if(!armed){ const dx=Math.abs(e.clientX-sx), dy=Math.abs(e.clientY-sy);
      if(dx<8&&dy<8) return; if(dy>dx){ down=false; return; } arm(); }
    go(e); });
  wrap.addEventListener("pointerup",e=>{ if(down&&!armed) go(e); down=false; armed=false; });
  wrap.addEventListener("pointercancel",()=>{ down=false; armed=false; });
  window.addEventListener("pointerup",()=>{ down=false; armed=false; });
})();
let rt; window.addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(()=>{renderCharts();scrub(tNow);if(mapReady&&map)map.resize();},150);});

renderCharts(); renderSectors();
initMap();
scrub(URLSTATE.t);
</script>
